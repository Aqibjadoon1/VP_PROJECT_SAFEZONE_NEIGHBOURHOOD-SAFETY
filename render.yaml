services:
  - type: web
    name: safezone
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: commit
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://+:8080
      - key: PORT
        value: "8080"
      - key: Jwt__Key
        generateValue: true
      - key: Jwt__Issuer
        value: SafeZone
      - key: Jwt__Audience
        value: SafeZoneClient
      - key: ElevenLabs__AgentId
        value: agent_8801kttn6txrem1v8gjy9m0g92w2
      - key: ElevenLabs__AllowUnsignedServerTools
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: SeedData__SuperAdminPassword
        sync: false
      - key: Gmail__ClientId
        sync: false
      - key: Gmail__ClientSecret
        sync: false
      - key: Gmail__RefreshToken
        sync: false
      - key: Gmail__FromEmail
        sync: false
      - key: Slack__WebhookUrl
        sync: false
